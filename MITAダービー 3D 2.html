<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MITAダービー 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--ink:#13203a;--mut:#5b6b86;--line:#b7c4da;--card:#fff;--acc:#ffc400;--bad:#c4222f;--good:#17804a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1829;--ink:#e9eefb;--mut:#93a3c2;--line:#3a4d73;--card:#15233d;--bad:#ff7b86;--good:#5fd99a}}
:root[data-theme="dark"]{--bg:#0e1829;--ink:#e9eefb;--mut:#93a3c2;--line:#3a4d73;--card:#15233d;--bad:#ff7b86;--good:#5fd99a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 "Zen Maru Gothic",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:14px 10px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{margin:0;font:400 clamp(1.4rem,6vw,2rem)/1.1 "Dela Gothic One",sans-serif;background:var(--acc);color:#13203a;padding:.15em .5em;transform:skewX(-8deg)}
.bank{text-align:right;line-height:1.1}.bank span{font-size:.75rem;color:var(--mut)}.bank b{display:block;font-size:1.5rem}
#stage{position:relative;height:min(46vh,340px);border-radius:14px;overflow:hidden;background:#9ad0f0;margin-bottom:6px}
#lap{position:absolute;top:8px;left:10px;background:rgba(15,26,46,.75);color:#fff;font-weight:700;padding:2px 10px;border-radius:8px;font-size:.85rem}
#vw{position:absolute;top:8px;right:10px;min-height:36px;padding:0 12px;border:0;border-radius:8px;background:rgba(15,26,46,.75);color:#fff;font:700 .85rem "Zen Maru Gothic",sans-serif;cursor:pointer}
#fol{position:absolute;bottom:8px;left:10px;max-width:62%;min-height:36px;padding:0 8px;border:0;border-radius:8px;background:rgba(15,26,46,.75);color:#fff;font:700 .8rem "Zen Maru Gothic",sans-serif}
#pf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.55);color:#fff;text-align:center;z-index:5;pointer-events:none}
#pf[hidden]{display:none}
#pf b{font:400 clamp(1.5rem,7vw,2.6rem)/1.2 "Dela Gothic One",sans-serif;text-shadow:0 2px 8px #000}
#pf span{font-weight:700;font-size:1.1rem;animation:bl 1s steps(2) infinite}
#pf.flash::before{content:"";position:absolute;inset:0;background:#fff;animation:fl .6s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#pf.flash::before,#pf span{animation:none}}
#rp{position:absolute;top:48px;left:10px;display:flex;gap:8px;align-items:center;background:rgba(15,26,46,.8);color:#fff;border-radius:8px;padding:2px 4px 2px 10px;font-weight:700;font-size:.85rem;z-index:4}
#rp[hidden]{display:none}
#rp button{min-height:32px;border:0;border-radius:6px;background:var(--acc);color:#13203a;font:700 .8rem "Zen Maru Gothic",sans-serif;cursor:pointer;padding:0 10px}
#rs{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#rs[hidden]{display:none}
.rsCard{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;width:min(100%,420px);max-height:100%;overflow:auto}
.rsCard h2{margin:0 0 10px;font:400 1.4rem "Dela Gothic One",sans-serif}
#rsList{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.rsRow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--ink) 8%,transparent);opacity:0;transform:translateY(14px);transition:opacity .4s,transform .4s}
.rsRow.on{opacity:1;transform:none}
.rsRow .rk{font-weight:700;min-width:2.6em}.rsRow .nm2{flex:1;font-weight:700}.rsRow .gt{color:var(--mut);font-size:.8rem}
.rsRow.r1{background:var(--acc);color:#13203a;font-size:1.25rem;padding:12px 10px}.rsRow.r1 .gt{color:#13203a}
#rsSum,#rsBtns{opacity:0;transition:opacity .4s}#rsSum.on,#rsBtns.on{opacity:1}#rsBtns:not(.on){pointer-events:none}
#rsBtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#rsBtns .chip{flex:1 1 auto}#rsBtns .go{flex:1 1 100%;width:auto}
#rsSum .big{font-weight:700;font-size:1.05rem;margin:0 0 4px}#rsSum ul{list-style:none;padding:0;margin:0}
@media (prefers-reduced-motion:reduce){.rsRow,#rsSum,#rsBtns{transition:none}}
#cv{display:block;width:100%;height:100%}
#log{white-space:pre-line;min-height:4.2em;margin:0 0 8px;font-size:.85rem;color:var(--mut)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
#ppl{margin-bottom:6px}
#board{display:flex;flex-wrap:wrap;gap:4px 8px;margin:0 0 8px;font-size:.85rem}#board:empty{display:none}#board span{padding:0 8px;border-radius:6px}#board .cur{background:var(--acc);color:#13203a;font-weight:700}
#sum{margin:0 0 8px;min-height:1.5em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip,.go,#reset{font:700 .95rem "Zen Maru Gothic",sans-serif;min-height:44px;border-radius:10px;cursor:pointer}
.chip{padding:0 14px;border:2px solid var(--line);background:transparent;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled,.go:disabled{opacity:.4;cursor:not-allowed}
.go{width:100%;border:0;background:var(--acc);color:#13203a;font-size:1.1rem}
#reset{width:100%;margin-top:6px;border:2px solid var(--bad);background:transparent;color:var(--bad)}
button:focus-visible,.lane:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
#res{margin-top:10px;padding-top:10px;border-top:2px dashed var(--line)}
#res .big{font-weight:700;font-size:1.1rem;margin:0 0 4px}.win{color:var(--good)}.lose{color:var(--bad)}
.lane{display:grid;grid-template-columns:1.5rem 1.6rem 1fr 4.6rem;gap:6px;align-items:center;min-height:40px;margin-bottom:2px;padding:0 6px;border-radius:10px;cursor:pointer;position:relative}
.lane input{position:absolute;opacity:0;pointer-events:none}
.lane:has(input:checked){background:color-mix(in srgb,var(--acc) 30%,transparent);box-shadow:0 0 0 2px var(--acc)}
.lane b{color:var(--mut);text-align:center}.lane .nm{font-weight:700}
.od{font-weight:700;font-size:.9rem;line-height:1.1;text-align:right}.od small{display:block;font-size:.68rem}
.nm small{display:block;font-size:.68rem;font-weight:500}
.up{color:var(--good)}.dn{color:var(--bad)}.md{color:var(--mut)}
.note{font-size:.78rem;color:var(--mut);margin:8px 0 0}
</style>
</head>
<body>
<main>
<header><h1>MITAダービー</h1><div class="bank"><span>コイン</span><b id="coin">1000</b></div></header>
<div id="stage"><canvas id="cv" aria-label="レースの3D映像"></canvas><div id="lap">1/2周</div><button id="vw" type="button">上から見る</button><select id="fol" aria-label="追いかける相手"></select><div id="rp" hidden><span>🎥 リプレイ</span><button id="rpSkip" type="button">スキップ</button></div><div id="pf" hidden role="status"><b id="pf1"></b><span id="pf2"></span></div></div>
<p id="log" aria-live="polite"></p>
<section class="panel">
<div class="chips" id="ppl" role="group" aria-label="遊ぶ人数"></div>
<p id="board"></p>
<p id="sum"></p>
<div class="chips" id="kind" role="group" aria-label="賭け方"></div>
<div class="chips" id="chips"></div>
<button class="go" id="go">スタート</button>
<button id="reset" hidden>コインを1000に戻す</button>
<div id="res" hidden></div>
<button class="chip" id="rsOpen" hidden style="margin-top:8px">🏆 結果発表とリプレイをもう一度見る</button>
</section>
<div id="lanes" role="group" aria-label="賭けるキャラ（複数選べます）"></div>
<p class="note">ゲーム内のコインだけで遊びます。校長は、コースの内側に見える木々を見ると興奮して加速し、トイレを見ると失速します。楕円のコースを2周します。人数を選ぶと、1台を回して順番に賭けるみんなモードで遊べます。毎レース、23体の中からランダムで7体が出走し、枠順と調子も変わります。オッズはその顔ぶれをもとに計算されます。</p>
</main>
<div id="rs" hidden role="dialog" aria-modal="true" aria-labelledby="rsT"><div class="rsCard">
<h2 id="rsT">結果発表</h2><ol id="rsList"></ol><div id="rsSum"></div>
<div id="rsBtns"><button class="chip" id="rsReplay">🎥 リプレイをもう一度</button><button class="chip" id="rsClose">閉じる</button><button class="go" id="rsNext">つぎのレース</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const C=[
{n:'校長',e:'👨‍🏫',b:4.4},{n:'暴走族',e:'🏍️',b:4.6},{n:'嵐(仮)',e:'🌪️',b:4.0},{n:'センチネル',e:'🤖',b:4.7},
{n:'キム',e:'🚀',b:3.1},{n:'学園長',e:'🎓',b:4.0},{n:'椅子破壊王',e:'🪑',b:3.8},{n:'おじいちゃん',e:'👴',b:2.7},
{n:'多動形',e:'⚡',b:4.0},{n:'戦車',e:'🪖',b:2.9},{n:'源頼朝もどき',e:'📜',b:3.9},{n:'自我を持ったカメラ',e:'📷',b:4.0},
{n:'iPad Air',e:'📱',b:4.0},{n:'マイケルジャクソンもどき',e:'🕺',b:3.6},{n:'三葉虫',e:'🪲',b:3.7},{n:'太陽系',e:'🪐',b:4.9},
{n:'ゼロからワン',e:'🔢',b:4.0},{n:'見たら死ぬ絵',e:'🖼️',b:3.0},{n:'全知全能の神 OCHI',e:'✨',b:3.9},{n:'ほうれん草',e:'🥬',b:2.2},
{n:'提出箱',e:'📥',b:4.2},{n:'Die eat',e:'🍰',b:5.0},{n:'サイバー攻撃するやつ',e:'💻',b:4.0}];
const FLY=[12,14,18];
// 風景の位置（1周を0〜100として）。校長はここに見える木とトイレに反応する
const GREEN=[[10,20],[56,66]],WC=[[38,44]],SPEED=1.4,LW=2.2,NL=7,R0=20,LS=60,LREF=2*LS+2*Math.PI*R0;
const lp=x=>(x*2)%100; // 全体の進み(0-100)を1周ごとの位置(0-100)に直す
const inz=(z,x)=>z.some(([a,b])=>x>=a&&x<b);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const condLab=v=>v>1?['絶好調','up']:v<1?['不調','dn']:['普通','md'];
const pickCond=()=>{const r=Math.random();return r<.2?1.06:r<.8?1:.94};

function makeRace(order,conds){
  const R=order.map((c,i)=>({i,c,x:0,cd:conds?conds[i]:pickCond(),f:.97+Math.random()*.06,bm:1,sh:0,beam:false,done:false,
    T:{slow:0,stun:0,boost:0,back:0,hop:0,shift:0,cd:0}}));
  return {t:0,R,fin:[],ev:[],fx:[]};
}
function step(S,dt,log){
  S.t+=dt;const R=S.R,t=S.t,n0=S.fin.length;
  const ch=p=>Math.random()<p*dt;
  const pk=a=>a[Math.random()*a.length|0];
  const nb=l=>[l-1,l+1].filter(j=>R[j]&&!R[j].done);
  const hit=(j,k,s)=>{const q=R[j];if(q&&!q.done){q.T[k]=Math.max(q.T[k],s);S.dist=(S.dist||0)+1}};
  const say=(r,s)=>{if(log)S.ev.push(C[r.c].e+' '+C[r.c].n+s)};
  const nm=j=>C[R[j].c].n;
  const fx=(a,b,k)=>{if(log)S.fx.push({a,b,k})};
  for(const r of R){
    if(r.done)continue;
    const T=r.T;r.ox=r.x;
    switch(r.c){
      case 1:if(ch(.09)){T.stun=1.4;say(r,'が事故った！')}break;
      case 2:if(ch(.3)){const j=pk(nb(r.i));if(j!==undefined){hit(j,'slow',1.3);fx(r.i,j,'gust');say(r,'が'+nm(j)+'を妨害')}}break;
      case 3:if(ch(.1)&&!T.back){T.back=1.2;say(r,'が逆走している')}break;
      case 4:
        if(ch(.12)&&!T.boost){T.boost=1.8;r.bm=2.4;say(r,'が猛ダッシュ！')}
        if(ch(.18)){const j=pk(nb(r.i));if(j!==undefined){hit(j,'slow',1.5);fx(r.i,j,'missile');say(r,'のミサイルが'+nm(j)+'に命中')}}break;
      case 5:if(ch(.25)){for(let j=r.i-2;j<=r.i+2;j++)if(j!==r.i)hit(j,'slow',.9);fx(r.i,-1,'wave');say(r,'が周りを遅くした')}break;
      case 6:if(ch(.14)&&!T.boost){T.boost=1.1;r.bm=1.9;T.hop=1.1;say(r,'がジャンプ加速！')}break;
      case 7:if(ch(.1)&&!T.boost){T.boost=2;r.bm=3.4;say(r,'がターボ発動！？')}break;
      case 8:if(ch(.2)&&!T.shift){const j=pk(nb(r.i));if(j!==undefined){hit(j,'slow',1.1);T.shift=1.1;r.sh=j-r.i;say(r,'が'+nm(j)+'のレーンに侵入')}}break;
      case 9:
        if(ch(.22)){let b=null;for(const q of R)if(q!==r&&!q.done&&(!b||q.x>b.x))b=q;if(b){hit(b.i,'slow',1.2);fx(r.i,b.i,'shell');say(r,'の砲撃が'+nm(b.i)+'に命中')}}
        if(ch(.1)&&!T.boost){T.boost=1.5;r.bm=1.9;say(r,'が走り出した')}break;
      case 10:
        if(Math.sin(t*4.5)>.3)T.hop=.15;
        if(ch(.25)){const q=pk(R.filter(o=>o!==r&&!o.done));if(q){hit(q.i,'slow',1);fx(r.i,q.i,'paper');say(r,'が'+nm(q.i)+'に紙を投げた')}}break;
      case 11:if(t>=11&&!r.beam){r.beam=true;say(r,'がレンズからビーム！')}break;
      case 12:if(ch(.06)){r.x=Math.min(99.5,r.x+4);say(r,'がワープした！')}break;
      case 13:
        if(ch(.12)&&!r.pend&&!T.back&&!T.boost){T.back=1.1;r.pend=1;say(r,'が逆走…')}
        if(r.pend&&T.back<=0){r.pend=0;T.boost=1.8;r.bm=3.2;say(r,'が超加速！')}break;
      case 14:if(ch(.12)&&!T.boost){T.boost=1.1;r.bm=1.8;T.hop=1.1;say(r,'が飛んだ')}break;
      case 15:if(r.x<50&&(r.pl||0)<8&&ch(.18)&&!T.boost){r.pl=(r.pl||0)+1;T.boost=1.2;r.bm=2.2;say(r,'が惑星を捨てて加速')}break;
      case 16:if(t>=11&&!r.go){r.go=1;say(r,'が突如大加速！')}break;
      case 17:
        if(ch(.25)&&(r.gr||0)<5){r.gr=(r.gr||0)+1;say(r,'が増殖した')}
        if(ch(.04+.015*(r.gr||0))){for(const q of R)if(q!==r)hit(q.i,'slow',.6);fx(r.i,-1,'wavedark');say(r,'の絵を見てしまった！')}break;
      case 18:if(r.x>=88&&!r.fell){r.fell=1;T.stun=5;say(r,'が転んだ…')}break;
      case 19:if((S.dist||0)>(r.sd||0)){r.sd=S.dist;T.boost=Math.max(T.boost,1);r.bm=2.5;if(Math.random()<.25)say(r,'が妨害を見て加速')}break;
      case 21:if(ch(.12)&&!T.stun){T.stun=1.8;say(r,'がケーキを食べている')}break;
    }
    let sp=C[r.c].b*r.f*r.cd*(1+.07*Math.sin(t*1.9+r.i*2.3));
    if(r.c===0){
      const g=inz(GREEN,lp(r.x)),w=inz(WC,lp(r.x));
      sp*=g?1.8:w?.3:1;
      if(log&&(g||w)&&!r.seen){r.seen=1;say(r,g?'が緑を見て大興奮！':'がトイレを見て失速')}
      if(!g&&!w)r.seen=0;
    }
    if(r.c===10)sp*=.1+2.6*Math.max(0,Math.sin(t*4.5));
    if(r.c===11)sp*=t<11?.12:1.6;
    if(r.c===15&&r.x>=50)sp*=.62;
    if(r.c===16)sp*=t<11?0:1.9;
    if(r.c===17)sp*=1+.11*(r.gr||0);
    if(r.c===18)sp*=1+.12*(r.hits||0);
    if(T.boost>0)sp*=r.bm;
    if(T.slow>0)sp*=.4;
    if(T.stun>0)sp=0;
    if(T.back>0)sp=-C[r.c].b*.5;
    r.x=Math.max(0,r.x+sp*dt);
    for(const k in T)T[k]=Math.max(0,T[k]-dt);
    if(r.x>=100){r.done=true;r.ov=r.x;r.x=100;S.fin.push(r.i)}
  }
  S.fin.push(...S.fin.splice(n0).sort((a,b)=>R[b].ov-R[a].ov));
  for(const a of R)for(const b of R){
    if(a===b||a.done||b.done||!(a.ox<b.ox&&a.x>=b.x))continue;
    if(a.c===16){hit(b.i,'stun',1);fx(a.i,b.i,'punch');say(a,'が'+nm(b.i)+'を抜いて1秒停止させた')}
    else if(a.c===18&&a.T.cd<=0){a.T.cd=1.2;hit(b.i,'stun',1.2);fx(a.i,b.i,'punch');a.hits=Math.min(8,(a.hits||0)+1);say(a,'が'+nm(b.i)+'をぶっ飛ばした！')}
    else if(a.c===20&&a.T.cd<=0){a.T.cd=1.5;hit(b.i,'stun',1.2);fx(a.i,b.i,'punch');say(a,'が'+nm(b.i)+'を気絶させた')}
    if(b.c===22&&b.T.cd<=0){b.T.cd=1.5;hit(a.i,'stun',1);fx(b.i,a.i,'packet');say(b,'が'+nm(a.i)+'にサイバー攻撃')}
  }
}
function calcOdds(order,conds){
  const N=500,w=Array(NL).fill(0),pl=Array(NL).fill(0);
  for(let n=0;n<N;n++){
    const s=makeRace(order,conds);
    while(s.fin.length<3&&s.t<90)step(s,.15,false);
    const top=[...s.fin,...s.R.filter(r=>!s.fin.includes(r.i)).sort((a,b)=>b.x-a.x).map(r=>r.i)].slice(0,3);
    w[top[0]]+=1;top.forEach(l=>{w[l]+=.2;pl[l]+=1});
  }
  const tot=w.reduce((a,b)=>a+b,0)+.5*NL;
  return {win:w.map(v=>{const p=.9*(v+.5)/tot+.1/NL;return Math.min(99.9,Math.max(1.2,.85/p))}),
    place:pl.map(c=>{const p=.9*(c+.5)/(N+1)+.1*3/NL;return Math.min(99.9,Math.max(1.1,.8/p))})};
}

/* ---------- 3D ---------- */
const stage=document.getElementById('stage'),cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ad0f0);scene.fog=new THREE.Fog(0x9ad0f0,90,230);
const cam=new THREE.PerspectiveCamera(42,1.5,.5,400);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a8a5a,.85));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(40,60,40);scene.add(sun);

const mat=c=>new THREE.MeshLambertMaterial({color:c});

  rows.forEach((r,i)=>rsT.push(setTimeout(()=>r.classList.add('on'),at[i])));
  rsT.push(setTimeout(finishRs,4100));
}
function startPf(wl,gap){
  pf={t:0,wl,w:S_.R[wl].c,gap,stage:0};
  const el=$('#pf');el.hidden=false;el.className='flash';$('#pf1').textContent='📸 写真判定';$('#pf2').textContent='判定中…';
}
function pfStep(){
  if(pf.t>1.6&&pf.stage===0&&!pf.mid){pf.mid=1;$('#pf2').textContent='写真を確認中…'}
  if(pf.t>3.2&&pf.stage===0){
    pf.stage=1;const w=C[pf.w];
    $('#pf1').textContent='🥇 '+w.e+' '+w.n;$('#pf2').textContent=(pf.wl+1)+'番　'+(pf.gap<.4?'ハナ差の勝利！':'僅差の勝利！');
    S_.ev.push('📸 判定の結果、'+w.e+' '+w.n+'が1着！');
  }
  if(pf.t>5.4){$('#pf').hidden=true;$('#pf').className='';pf=null}
}
function frame(ts){
  const rt=ts/1000,fdt=Math.min(.05,rt-(frame.lt||rt));frame.lt=rt;if(!pf)animT+=fdt;const t=animT;
  if(rp){stepReplay(fdt);if(rp)renderer.render(scene,cam);requestAnimationFrame(frame);return}
  if(phase==='run'){
    if(pf){pf.t+=fdt;last=ts;pfStep()}
    else{
      if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000)*SPEED;last=ts;step(S_,dt,true);
      if(!S_.pfDone&&S_.fin.length>=1){
        S_.pfDone=1;const w=S_.R[S_.fin[0]];
        const gap=S_.fin.length>=2?w.ov-S_.R[S_.fin[1]].ov:100-S_.R.filter(r=>!r.done).reduce((m,r)=>r.x>m?r.x:m,-1);
        S_.rgap=gap;if(gap<=.8)startPf(w.i,gap);
      }
      if(!pf&&(S_.fin.length>=3||S_.R.every(r=>r.done)||S_.t>90))endRace();
    }
  }
  while(S_.fx.length){const f=S_.fx.shift();spawnShot(f.a,f.b,f.k)}
  updFx(pf?0:fdt);
  let lr=S_.R[0];
  S_.R.forEach((r,l)=>{
    if(r.x>lr.x)lr=r;
    const g=actors[l],u=g.userData,T=r.T,m=u.m,run=phase==='run'&&!r.done&&T.stun<=0;
    u.ln+=((l+(T.shift>0?r.sh:0))-u.ln)*.2;
    const top=view==='top';m.scale.setScalar((top?2.2:1)*(1+.12*(r.gr||0)));u.sp.scale.set(top?8:4.6,top?2.1:1.15,1);
    const st=T.stun>0?'stun':T.back>0?'back':T.slow>0?'slow':T.boost>0?'boost':'';
    if(st!==u.st){u.st=st;if(st)burst(new THREE.Vector3(g.position.x,g.position.y+1.5,g.position.z),STC[st])}
    u.ic.visible=u.shell.visible=!!st;
    if(st){u.ic.material.map=EMO[st];u.ic.scale.setScalar(top?3.4:1.5);u.ic.position.y=top?9:5.3;
      u.shell.material.color.setHex(STC[st]);u.shell.scale.setScalar((top?2.2:1)*(1+.07*Math.sin(t*10)))}
    const p=pos(r.x/50,R0+u.ln*LW),lx=lp(r.x);
    let y=run?Math.abs(Math.sin(t*11+l))*.22:0;if(FLY.includes(r.c))y+=1.7+Math.sin(t*3+l)*.25;
    if(T.hop>0)y+=1.2*Math.sin(Math.min(1,T.hop%.5/.5)*Math.PI);
    if(r.c===0&&run){if(inz(GREEN,lx))y+=Math.abs(Math.sin(t*22))*.7;else if(inz(WC,lx)){m.rotation.z=Math.sin(t*30)*.12}else m.rotation.z=0}
    const jit=r.c===8&&run?Math.sin(t*35)*.3:0;
    g.position.set(p.x+p.nx*jit,y,p.z+p.nz*jit);
    g.rotation.y=Math.atan2(-p.tz,p.tx);
    m.rotation.y=T.back>0?Math.PI:0;
    m.rotation.x=T.stun>0?-.9:0;
    if(r.c!==0)m.rotation.z=T.stun>0?-.5:0;
    if(u.spin)u.spin.rotation.y+=.25;
    if(u.orb)u.orb.children.forEach((c,i)=>c.visible=i>=(r.pl||0));
    if(u.roll&&run)u.roll.rotation.z-=.35;
    if(u.beam)u.beam.visible=r.beam&&phase==='run';
  });
  // 先頭を外側から追うカメラ
  const tr=folLane>=0&&S_.R[folLane]?S_.R[folLane]:lr,pl=pos(tr.x/50,R0+(folLane>=0&&actors[folLane]?actors[folLane].userData.ln:(NL-1)/2)*LW);let cx=pl.x+pl.nx*22-pl.tx*6,cy=15,cz=pl.z+pl.nz*22-pl.tz*6,lx2=pl.x+pl.tx*8,lz2=pl.z+pl.tz*8;
  if(view==='top'){const th=Math.tan(cam.fov*Math.PI/360);cy=Math.max(68/(th*cam.aspect),38/th)*1.04;cx=0;cz=6;lx2=0;lz2=0}
  scene.fog.near=view==='top'?900:90;scene.fog.far=view==='top'?1500:230;
  if(camSnap){cam.position.set(cx,cy,cz);camLook.set(lx2,0,lz2);camSnap=false}
  cam.position.x+=(cx-cam.position.x)*.08;cam.position.y+=(cy-cam.position.y)*.08;cam.position.z+=(cz-cam.position.z)*.08;
  camLook.x+=(lx2-camLook.x)*.1;camLook.z+=(lz2-camLook.z)*.1;cam.lookAt(camLook);
  if(phase==='run'&&!pf)recSnap(t);
  renderer.render(scene,cam);
  $('#lap').textContent=Math.min(2,Math.floor(tr.x/50)+1)+'/2周';
  $('#log').textContent=S_.ev.slice(-3).join('\n');
  requestAnimationFrame(frame);
}
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(stage);

/* ---------- UI ---------- */
const $=s=>document.querySelector(s);
const load=()=>{try{const v=localStorage.getItem('mita3d');const x=+v;return v===null||!isFinite(x)?1000:x}catch(e){return 1000}};
const mk=n=>Array.from({length:n},()=>({coin:n===1?load():1000,picks:[],bet:100,kind:'win',stake:0,tot:0,pay:0,net:0}));
let PL=mk(1),cp=0,phase='bet',S_,odd=[],last=0;
const save=()=>{if(PL.length===1)try{localStorage.setItem('mita3d',PL[0].coin)}catch(e){}};
const alive=()=>PL.map((p,i)=>i).filter(i=>PL[i].coin>0);
const nextAlive=i=>{for(let k=i+1;k<PL.length;k++)if(PL[k].coin>0)return k;return -1};

function newRace(){
  S_=makeRace(shuffle([...C.keys()]).slice(0,NL));
  odd=calcOdds(S_.R.map(r=>r.c),S_.R.map(r=>r.cd));
  PL.forEach(p=>{p.picks=p.picks.filter(c=>S_.R.some(r=>r.c===c));p.bet=Math.min(p.bet,Math.max(p.coin,1))});
  cp=alive()[0]??0;phase='bet';last=0;camSnap=true;
  $('#res').hidden=true;closeRs();pf=null;rp=null;rec.length=0;$('#pf').hidden=true;$('#rp').hidden=true;buildActors();
  folLane=-1;$('#fol').innerHTML='<option value="-1">先頭を追う</option>'+S_.R.map((r,l)=>`<option value="${l}">${l+1} ${C[r.c].e}${C[r.c].n}を追う</option>`).join('');
  $('#lanes').innerHTML=S_.R.map((r,l)=>{const [lb,cl]=condLab(r.cd);
    return `<label class="lane"><input type="checkbox" name="p" value="${r.c}"><b>${l+1}</b><span>${C[r.c].e}</span><span class="nm">${C[r.c].n}<small class="${cl}">${lb}</small></span><span class="od">×${odd.win[l].toFixed(1)}<small class="md">複×${odd.place[l].toFixed(1)}</small></span></label>`}).join('');
  ui();
}
function ui(){
  const n=PL.length,Q=PL[cp],run=phase==='run',res=phase==='res',b=Q.bet,bet=phase==='bet';
  $('.bank').hidden=n>1;$('#coin').textContent=PL[0].coin;
  $('#ppl').innerHTML=[1,2,3,4,5,6].map(v=>`<button class="chip" data-n="${v}" aria-pressed="${v===n}"${run?' disabled':''}>${v===1?'ひとり':v+'人'}</button>`).join('');
  $('#kind').innerHTML=[['win','単勝（1着）'],['place','複勝（3着以内）']].map(([k,t])=>`<button class="chip" data-k="${k}" aria-pressed="${Q.kind===k}"${bet?'':' disabled'}>${t}</button>`).join('');
  $('#board').innerHTML=n>1?PL.map((p,i)=>`<span class="${bet&&i===cp?'cur':''}">プレイヤー${i+1} <b>${p.coin}</b></span>`).join(''):'';
  const k=Q.picks.length,lane=k?S_.R.findIndex(r=>r.c===Q.picks[0]):-1;
  $('#sum').hidden=!bet;
  $('#sum').textContent=(n>1?`プレイヤー${cp+1}：`:'')+(k===0?'賭けたいキャラを下から選んでください'+(Q.kind==='win'?'（1頭だけ）。':'（何頭でもOK）。')
    :`${Q.picks.map(c=>C[c].e+C[c].n).join('、')} の${Q.kind==='win'?'単勝':'複勝'}に 1頭あたり ${b} コイン（合計 ${b*k}）`+(k===1?`。当たれば ${Math.floor(b*odd[Q.kind][lane])} コイン。`:'。'));
  $('#chips').innerHTML=[100,300,500,1000,'全部'].map(v=>{const val=v==='全部'?Math.floor(Q.coin/Math.max(k,1)):v;
    return `<button class="chip" data-v="${val}" aria-pressed="${val===b}"${!bet||val<1||val*Math.max(k,1)>Q.coin?' disabled':''}>${v}</button>`}).join('');
  document.querySelectorAll('.lane input').forEach(i=>{i.checked=Q.picks.includes(+i.value);i.disabled=!bet});
  const nx=nextAlive(cp),go=$('#go'),ok=k>0&&b>=1&&b*k<=Q.coin;
  go.textContent=res?'つぎのレース':run?'レース中…':nx>=0?`決定（つぎはプレイヤー${nx+1}）`:'スタート';
  go.disabled=run||(bet&&!ok)||(res&&!alive().length);
  $('#reset').hidden=!(alive().length===0&&!run);
  $('#rsOpen').hidden=!res;
  $('#reset').textContent=n>1?'みんなのコインを1000に戻す':'コインを1000に戻す';
}
function finish(){
  const rest=S_.R.filter(r=>!S_.fin.includes(r.i)).sort((a,b)=>b.x-a.x).map(r=>r.i);
  const top=[...S_.fin,...rest].slice(0,3),wl=top[0],wc=S_.R[wl].c,n=PL.length;
  PL.forEach(p=>{p.pay=0;if(p.stake>0)p.picks.forEach(c=>{const L=S_.R.findIndex(r=>r.c===c),won=p.kind==='win'?c===wc:top.some(l=>S_.R[l].c===c);if(won)p.pay+=Math.floor(p.stake*odd[p.kind][L])});p.net=p.pay-p.tot;p.coin+=p.pay;p.bet=Math.min(p.bet,Math.max(p.coin,1))});
  save();phase='res';cp=alive()[0]??0;
  const med=['🥇','🥈','🥉'],res=$('#res');res.hidden=false;
  const podium=`<ol style="list-style:none;padding:0;margin:0 0 8px">${top.map((l,k)=>`<li>${med[k]} ${C[S_.R[l].c].e} ${C[S_.R[l].c].n}</li>`).join('')}</ol>`;
  if(n===1){const p=PL[0];
    res.innerHTML=`<p class="big ${p.net>0?'win':'lose'}">${p.pay>0?'的中！':'ハズレ…'} 払い戻し ${p.pay}、収支 ${p.net>=0?'+':'−'}${Math.abs(p.net)} コイン</p>`+podium}
  else res.innerHTML=podium+'<ul style="list-style:none;padding:0;margin:0">'+PL.map((p,i)=>
    `<li>プレイヤー${i+1}：${p.stake>0?`${p.picks.map(c=>C[c].e).join('')}${p.kind==='win'?'単勝':'複勝'} 払戻 ${p.pay}、収支 ${p.net>=0?'+':'−'}${Math.abs(p.net)}`:'脱落'}（残り ${p.coin}）</li>`).join('')+'</ul>';
  ui();
  showResult(true,top);
}
$('#lanes').addEventListener('change',e=>{if(e.target.name==='p'){const c=+e.target.value,Q=PL[cp],a=Q.picks;Q.picks=e.target.checked?(Q.kind==='win'?[c]:[...a,c]):a.filter(x=>x!==c);ui()}});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&!b.disabled){PL[cp].bet=+b.dataset.v;ui()}});
$('#kind').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&!b.disabled){PL[cp].kind=b.dataset.k;if(b.dataset.k==='win')PL[cp].picks=PL[cp].picks.slice(0,1);ui()}});
$('#ppl').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b||b.disabled||+b.dataset.n===PL.length)return;PL=mk(+b.dataset.n);newRace()});
$('#go').addEventListener('click',()=>{
  if(phase==='res'){newRace();return}
  const Q=PL[cp];if(phase!=='bet'||!Q.picks.length||Q.bet<1||Q.bet*Q.picks.length>Q.coin)return;
  const nx=nextAlive(cp);
  if(nx>=0){cp=nx;ui();return}
  PL.forEach(p=>{p.stake=p.coin>0&&p.picks.length&&p.bet*p.picks.length<=p.coin?p.bet:0;p.tot=p.stake*p.picks.length;p.coin-=p.tot});
  save();cp=0;phase='run';last=0;ui();
  stage.scrollIntoView({block:'nearest',behavior:'smooth'});
});
$('#reset').addEventListener('click',()=>{PL.forEach(p=>{p.coin=1000;p.bet=100});save();cp=0;if(phase==='res')newRace();else ui()});
newRace();
$('#rs').addEventListener('click',e=>{if(!rsDone){if(e.target.closest('.rsCard'))finishRs()}else if(e.target.id==='rs')closeRs()});
$('#rsClose').addEventListener('click',closeRs);
$('#rsReplay').addEventListener('click',()=>{if(rec.length>30){closeRs();startReplay(true)}});
$('#rsNext').addEventListener('click',()=>{closeRs();const g=$('#go');if(!g.disabled)g.click()});
$('#rsOpen').addEventListener('click',()=>showResult(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#rs').hidden&&rsDone)closeRs()});
$('#rpSkip').addEventListener('click',()=>{if(rp)finishReplay()});
$('#fol').addEventListener('change',e=>{folLane=+e.target.value});
$('#vw').addEventListener('click',e=>{view=view==='top'?'follow':'top';e.target.textContent=view==='top'?'追いかける':'上から見る'});
requestAnimationFrame(frame);
</script>
